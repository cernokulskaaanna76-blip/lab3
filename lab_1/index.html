<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сервіс чергувань</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.ts"></script>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Сервіс чергувань</div>

        <div class="nav-links">
            <a href="#formBlock">Додати</a>
            <a href="#listBlock">Список</a>
        </div>
    </nav>

    <div class="container">

        <section id="formBlock" class="card">

            <h1>Додати зміну</h1>

            <form id="shiftForm">

                <div class="field">
                    <label>Дата</label>
                    <input type="date" id="dateInput">
                </div>

                <div class="field">
                    <label>Тип зміни</label>
                    <select id="timeSlotSelect">
                        <option value="">Оберіть</option>
                        <option value="day">День</option>
                        <option value="night">Ніч</option>
                    </select>
                </div>

                <div class="field">
                    <label>Користувач</label>
                    <select id="userInput"></select>
                </div>

                <div class="field">
                    <label>Графік</label>
                    <select id="scheduleSelect"></select>
                </div>

                <div class="field">
                    <label>Коментар</label>
                    <textarea id="commentInput"></textarea>
                </div>

                <div class="field">
                    <label>Статус</label>
                    <select id="statusSelect">
                    <option value="">
                        Оберіть
                    </option>
                    
                    <option value="planned">
                        Заплановано
                    </option>
                    
                    <option value="done">
                        Підтверджено
                    </option>
                    
                    <option value="cancelled">
                        Скасовано
                    </option>
                    </select>
                </div>

                <div class="buttons">
                    <button type="submit">Зберегти</button>
                    <button type="button" id="resetBtn">Очистити</button>
                </div>

                <div id="successMessage"></div>

            </form>
        </section>

        <section id="listBlock" class="card">

            <h1>Список змін</h1>

            <div class="field">
                <label>Фільтр по статусу</label>
                <select id="filterStatus">
                    <option value="">Усі</option>
                    <option value="planned">Заплановано</option>
                    <option value="done">Виконано</option>
                    <option value="cancelled">Скасовано</option>
                </select>
            </div>

            <button id="sortDate">Сортувати по даті</button>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Дата</th>
                        <th>Тип</th>
                        <th>Користувач</th>
                        <th>Статус</th>
                        <th>Дії</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>

        </section>

    </div>

</body>

</html>
